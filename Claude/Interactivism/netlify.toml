[build]
  command = "npm run build"
  publish = "dist"
  ignore = "git diff --quiet HEAD^ HEAD -- . ':!*.md'"

[build.environment]
  NODE_VERSION = "20"

# ============================================================
# Services — top-level renames
# ============================================================

[[redirects]]
  from = "/services/ux-design/"
  to = "/services/product-design/"
  status = 301

[[redirects]]
  from = "/services/strategy-growth/"
  to = "/services/product-strategy/"
  status = 301

[[redirects]]
  from = "/services/research/"
  to = "/services/user-research/"
  status = 301

# Case-sensitive variant that appears in the live sitemap
[[redirects]]
  from = "/services/Research/"
  to = "/services/user-research/"
  status = 301

[[redirects]]
  from = "/services/training/"
  to = "/services/"
  status = 301

# ============================================================
# Services — sub-category pages (three-level → two-level)
# Specific rules first, wildcards last.
# ============================================================

# /services/ux-design/* — most map to product-design
[[redirects]]
  from = "/services/ux-design/information-architecture/"
  to = "/services/product-design/"
  status = 301

[[redirects]]
  from = "/services/ux-design/interaction-design/"
  to = "/services/product-design/"
  status = 301

[[redirects]]
  from = "/services/ux-design/user-interface-design/"
  to = "/services/product-design/"
  status = 301

[[redirects]]
  from = "/services/ux-design/data-visualization/"
  to = "/services/product-design/"
  status = 301

[[redirects]]
  from = "/services/ux-design/prototyping/"
  to = "/services/product-design/"
  status = 301

# Branding sub-page now lives under brand-development
[[redirects]]
  from = "/services/ux-design/identity-branding/"
  to = "/services/brand-development/"
  status = 301

# SEO was a product strategy capability, not a design sub-service
[[redirects]]
  from = "/services/ux-design/seo/"
  to = "/services/product-strategy/"
  status = 301

# Emerging tech → human-ai-experience
[[redirects]]
  from = "/services/ux-design/emerging-technologies/"
  to = "/services/human-ai-experience/"
  status = 301

# Catch-all for any remaining /services/ux-design/* sub-pages
[[redirects]]
  from = "/services/ux-design/*"
  to = "/services/product-design/"
  status = 301

# /services/human-ai-experience/* sub-pages
[[redirects]]
  from = "/services/human-ai-experience/*"
  to = "/services/human-ai-experience/"
  status = 301

# /services/research/* sub-pages
[[redirects]]
  from = "/services/research/*"
  to = "/services/user-research/"
  status = 301

# /services/development/* sub-pages
[[redirects]]
  from = "/services/development/*"
  to = "/services/development/"
  status = 301

# /services/strategy-growth/* sub-pages
[[redirects]]
  from = "/services/strategy-growth/*"
  to = "/services/product-strategy/"
  status = 301

# /services/training/* sub-pages (training not in new site)
[[redirects]]
  from = "/services/training/*"
  to = "/services/"
  status = 301

