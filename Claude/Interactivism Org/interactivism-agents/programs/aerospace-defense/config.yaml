# Aerospace & Defense Outbound Program Configuration
# Instance of contracts/program-config-schema.yaml

program:
  id: prog.aerospace-defense
  slug: aerospace-defense
  label: Aerospace & Defense
  status: blocked-on-anchor   # Kratos case study not yet published; unblocks when anchor publishes
  launched: ~               # set at activation; do not date a program that hasn't sent
  operating_partner: partner.erik   # previously set; not confirmed as a Build 3 decision
  disclosure_domain: aerospace-defense

vertical:
  name: Aerospace & Defense
  description: >
    Defense contractors, systems integrators, FFRDCs, and government-adjacent
    technology organizations requiring mission-critical product design for
    operator tools, ground systems, and data visualization platforms.
  icp:
    company_type:
      - prime contractor
      - sub-tier contractor
      - FFRDC
      - government-adjacent technology
    company_size: "500–50,000 employees"
    geography:
      - United States
    titles:
      - VP of Engineering
      - Director of Product
      - Chief Engineer
      - Program Manager
      - CTO
    pain_points:
      - Operator interface complexity leading to training burden and error risk
      - Legacy UI/UX patterns that don't scale to modern data volume
      - Design systems absent or inconsistent across programs
      - Gap between engineering-built tools and operator workflow needs
    disqualifiers:
      - Consumer product only
      - No operator-facing software component
      - Foreign prime (ITAR sensitivity)

credential_anchors:
  - credential_id: cred.aerospace-defense
    positioning_notes: >
      Anchor on Kratos OpsCenter (operator interface for satellite ground systems)
      and OpenSpace Design System. Caltech and JPL provide academic/research tier
      credibility. Frame as: design for high-stakes operator environments where
      interface failure has mission consequences.
    reference_clients:
      - Kratos Defense
      - Caltech
      - NASA/JPL
    anchor_status: pending   # Kratos case study not yet published; blocks program activation
    anchor_url: ~            # set when Kratos publishes

voice_corpus:
  - type: email-sample
    path: contracts/reference-set/outbound/aerospace-defense-sample-1.md
    notes: Viasat — design leader, Sketch→Figma migration panel hook
  - type: email-sample
    path: contracts/reference-set/outbound/aerospace-defense-sample-2.md
    notes: Booz Allen — IITSEC / training & mission systems hook
  - type: email-sample
    path: contracts/reference-set/outbound/aerospace-defense-sample-3.md
    notes: MITRE — aviation simulation / FAA drone risk model hook
  - type: email-sample
    path: contracts/reference-set/outbound/aerospace-defense-sample-4.md
    notes: L3Harris — Artemis II / mission-comms hook
  - type: proposal-excerpt
    path: contracts/reference-set/proposal/caltech-ipac-2022-excerpt.md
    notes: >
      Caltech IPAC 2022 — best example of Foundation-first scoping, range
      estimates with explicit assumptions, and full-phase proposal structure.
      Not A&D-specific — swap for an approved A&D proposal excerpt when available.

sequence_config:
  max_touches: 5
  touch_cadence_days: [0, 3, 7, 14, 21]
  channels: [email, linkedin]
  personalization_depth: deep

crm:
  tool: apollo
  list_id: ~        # TODO: add Apollo list ID
  stage_field: ~    # TODO: confirm Apollo stage field name
  notes: "Primary outbound CRM. See contracts/crm-conventions.md once populated."

escalation:
  positive_reply: lead-partner
  objection_reply: lead-partner
  unknown_reply: lead-partner
  disclosure_question: register-lookup   # routes to partner.erik via cred.aerospace-defense

review_gate:
  - All sequence messages reviewed and approved by partner.erik before deployment
  - ICP confirmed against current register
  - Voice corpus seeded with ≥3 samples from partner.erik
  - A&D disclosure term list (contracts/disclosure/aerospace-defense.md) in place before any A&D case study references appear in sequences
